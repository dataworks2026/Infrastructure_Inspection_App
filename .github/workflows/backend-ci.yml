name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mira
          POSTGRES_PASSWORD: mira
          POSTGRES_DB: mira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://mira:mira@localhost:5432/mira_test
      SECRET_KEY: ci-test-secret-do-not-use-in-prod
      STORAGE_BASE_PATH: /tmp/mira-storage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff
          # Install without heavy ML deps (torch/ultralytics) for CI speed
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy \
            psycopg2-binary python-jose passlib pillow numpy aiofiles \
            email-validator bcrypt httpx python-dotenv python-multipart \
            pandas scipy PyYAML pytest pytest-asyncio httpx sentry-sdk

      - name: Lint (ruff)
        run: ruff check app/ --select E,F,W --ignore E501

      - name: Run tests
        run: pytest tests/ -x -q --ignore=tests/MANUAL_E2E.md
