events { worker_connections 1024; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml model/obj;
    client_max_body_size 500M;

    upstream frontend { server frontend:3000; }
    upstream backend  { server backend:8000; }
    upstream twin     { server twin-nginx:80; }

    # Shared proxy rules for the app. Included by both the plain-HTTP server
    # (bare-IP access) and the TLS server so the two can never drift apart.
    # See HTTPS_SETUP.md.

    # ── All plain HTTP → HTTPS ──
    # One block covers both the bare IP (http://3.133.43.231) and the hostname.
    # Redirecting the IP is safe because the target is the *hostname*, which the
    # certificate covers — redirecting to https://<same-ip> would instead give
    # every visitor a certificate-mismatch warning.
    server {
        listen 80 default_server;
        server_name _;

        # Must stay reachable over plain HTTP or certificate renewal fails.
        # Declared before the catch-all so it is never redirected.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 307, not 301: sslip.io is a stopgap until a real domain is pointed
        # here, and browsers cache permanent redirects near-indefinitely — a
        # 301 would keep sending users to the sslip.io name long after a move,
        # with no way to clear it from their cache. 307 also preserves method
        # and body, so an in-flight POST is not downgraded to GET.
        location / {
            return 307 https://3-133-43-231.sslip.io$request_uri;
        }
    }

    # ── HTTPS ──
    server {
        listen 443 ssl;
        http2 on;
        server_name 3-133-43-231.sslip.io;

        ssl_certificate     /etc/letsencrypt/live/3-133-43-231.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/3-133-43-231.sslip.io/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Deliberately short. A long max-age with a bad certificate makes the
        # site unreachable for that duration with no server-side remedy.
        # Raise only once HTTPS is confirmed stable.
        add_header Strict-Transport-Security "max-age=300" always;

        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /storage/ {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
        }

        location /twin/ {
            proxy_pass         http://twin/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location /twin-data/ {
            proxy_pass         http://twin/twin-data/;
            proxy_set_header   Host $host;
            proxy_read_timeout 600s;
            proxy_buffering    off;
        }

        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }
}
