events { worker_connections 1024; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml model/obj;
    client_max_body_size 500M;

    upstream frontend { server frontend:3000; }
    upstream backend  { server backend:8000; }
    upstream twin     { server twin-nginx:80; }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /storage/ {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
        }

        # Twin viewer page + ODM mesh/texture assets
        # (the twin-nginx sidecar serves /var/www/twin-viewer at / and /var/lib/odm-data at /twin-data)
        location /twin/ {
            proxy_pass         http://twin/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location /twin-data/ {
            proxy_pass         http://twin/twin-data/;
            proxy_set_header   Host $host;
            # OBJ + textures can be hundreds of MB
            proxy_read_timeout 600s;
            proxy_buffering    off;
        }

        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }
}
