events { worker_connections 1024; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml model/obj;
    client_max_body_size 500M;

    upstream frontend { server frontend:3000; }
    upstream backend  { server backend:8000; }
    upstream twin     { server twin-nginx:80; }

    # Canonical hostname served over HTTPS: platform.miraintel.com
    # Everything else (bare IP, the old sslip.io name) redirects to it.
    # See HTTPS_SETUP.md.

    # ── All plain HTTP → HTTPS on the canonical hostname ──
    # Covers the bare IP and any hostname. Redirecting to the canonical NAME
    # (not to https://<same-ip>) is what keeps the certificate valid for the
    # destination.
    server {
        listen 80 default_server;
        server_name _;

        # Must stay reachable over plain HTTP or certificate renewal fails.
        # Declared before the catch-all so it is never redirected.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 301 permanent: platform.miraintel.com is the final hostname.
        location / {
            return 301 https://platform.miraintel.com$request_uri;
        }
    }

    # ── Old sslip.io name over HTTPS → redirect to the canonical name ──
    # Keeps any already-shared https://3-133-43-231.sslip.io link working.
    # It has its own valid certificate, so the redirect happens without a
    # browser warning.
    server {
        listen 443 ssl;
        http2 on;
        server_name 3-133-43-231.sslip.io;

        ssl_certificate     /etc/letsencrypt/live/3-133-43-231.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/3-133-43-231.sslip.io/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            return 301 https://platform.miraintel.com$request_uri;
        }
    }

    # ── HTTPS — platform.miraintel.com (the app) ──
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name platform.miraintel.com;

        ssl_certificate     /etc/letsencrypt/live/platform.miraintel.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/platform.miraintel.com/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Short max-age until HTTPS is confirmed stable in the wild. A long
        # HSTS with a bad cert makes the site unreachable with no server-side
        # remedy. Raise to 6mo+ once confident.
        add_header Strict-Transport-Security "max-age=300" always;

        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /storage/ {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
        }

        location /twin/ {
            proxy_pass         http://twin/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location /twin-data/ {
            proxy_pass         http://twin/twin-data/;
            proxy_set_header   Host $host;
            proxy_read_timeout 600s;
            proxy_buffering    off;
        }

        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }
}
